name: open-llm
services:
  qwen:
    image: ${QWEN_IMAGE:-open-llm-qwen3:1.0}
    platform: ${QWEN_PLATFORM:-linux/amd64}
    build:
      context: .
      args:
        BUILD_JOBS: ${BUILD_JOBS:-6}
    restart: unless-stopped
    ports:
      - "${QWEN_BIND_IP:-127.0.0.1}:${QWEN_PORT:-8082}:8082"
    environment:
      QWEN_THREADS: ${QWEN_THREADS:-6}
      QWEN_THREADS_BATCH: ${QWEN_THREADS_BATCH:-6}
      QWEN_CTX_SIZE: ${QWEN_CTX_SIZE:-4096}
      QWEN_PARALLEL: ${QWEN_PARALLEL:-1}
      LLAMA_API_KEY: ${QWEN_API_KEY:-}
    mem_limit: ${QWEN_MEM_LIMIT:-22000000000}
    mem_reservation: ${QWEN_MEM_RESERVATION:-18000000000}
    # Equal memory and combined memory+swap limits disable container swap.
    memswap_limit: ${QWEN_MEMSWAP_LIMIT:-22000000000}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=67108864,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
